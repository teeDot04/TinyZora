name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build llama-server for Android ARM64
      run: |
        git clone https://github.com/ggerganov/llama.cpp.git --depth 1 /tmp/llama-cpp
        cd /tmp/llama-cpp
        NDK=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -1)
        echo "Using NDK: $NDK"
        cmake -B build-android \
          -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLAMA_CURL=OFF \
          -DGGML_OPENMP=OFF \
          -DBUILD_SHARED_LIBS=ON
        cmake --build build-android -j$(nproc) --target llama-server
        mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
        find build-android -name "llama-server" -type f ! -name "*.cmake" \
          -exec cp {} $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libllama_server.so \;
        find build-android -name "*.so" \
          -exec cp {} $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/ \;
        echo "=== jniLibs ==="
        ls -lh $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
