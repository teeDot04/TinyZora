name: Build TinyZora APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Clone llama.cpp into the project root so CMakeLists.txt can find it
    - name: Clone llama.cpp
      run: |
        git clone --recurse-submodules --depth 1 --shallow-submodules https://github.com/ggerganov/llama.cpp.git
        # Fallback: manually download nlohmann/json if submodule failed
        if [ ! -f "llama.cpp/vendor/nlohmann/json/single_include/nlohmann/json_fwd.hpp" ]; then
          echo "Submodule failed, downloading nlohmann/json manually..."
          mkdir -p llama.cpp/vendor/nlohmann/json/single_include/nlohmann
          curl -L https://raw.githubusercontent.com/nlohmann/json/develop/single_include/nlohmann/json_fwd.hpp -o llama.cpp/vendor/nlohmann/json/single_include/nlohmann/json_fwd.hpp
          curl -L https://raw.githubusercontent.com/nlohmann/json/develop/single_include/nlohmann/json.hpp -o llama.cpp/vendor/nlohmann/json/single_include/nlohmann/json.hpp
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Use the official Gradle action so we don't need to commit the gradlew wrapper from Termux
    - name: Build with Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.7'
        arguments: assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tinyzora-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
